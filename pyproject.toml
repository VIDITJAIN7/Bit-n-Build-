[project]
name = "workkite-api"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "psycopg[binary]==3.2.9",
  "uvicorn==0.34.2",
]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [".venv", "node_modules"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["apps/api/tests"]
pythonpath = ["apps/api"]
